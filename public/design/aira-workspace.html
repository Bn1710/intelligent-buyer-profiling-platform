<style>
:root{--navy:#18343b;--ink:#263c40;--muted:#61736f;--gold:#9b7542;--paper:#f5f5f0;--line:#dce3de;--white:#fff;--green:#236248}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 Arial,Helvetica,sans-serif;color:var(--ink);background:#e4e9e6}button,input,select,textarea{font:inherit}button{cursor:pointer}button,a,input,select,textarea{outline-offset:4px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #bb975e}button{min-height:44px;border-radius:8px;border:1px solid var(--line);background:white;color:var(--ink);padding:9px 14px}button:hover{background:#edf2ee}button:disabled{opacity:.5;cursor:not-allowed}h1,h2,h3,p{margin:0}h1{font:38px/1.2 Georgia,serif}h2{font:26px/1.25 Georgia,serif}h3{font-size:16px}small,.muted{color:var(--muted)}.primary{background:var(--navy);color:white;border-color:var(--navy)}.primary:hover{background:#294c52}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--gold);text-transform:uppercase;font-weight:bold}.prototype-bar{background:#111f25;color:#e8eee9;padding:18px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.prototype-bar h2{font:19px Arial,sans-serif}.prototype-bar p{font-size:12px;color:#bfcac5;margin-top:4px}.prototype-controls{display:flex;gap:8px;flex-wrap:wrap}.prototype-controls button{font-size:12px;background:#23363e;color:white;border-color:#42565d}.prototype-controls .chosen{background:#e8d6b7;color:#18343b;border-color:#e8d6b7}.canvas{max-width:1510px;margin:25px auto;box-shadow:0 20px 65px #17333b18;border-radius:14px;overflow:hidden;background:var(--paper);min-height:800px}.shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:800px}.sidebar{background:var(--navy);color:#e5ede8;padding:30px 20px;display:flex;flex-direction:column;gap:28px}.brand{font:30px Georgia,serif;letter-spacing:5px}.brand small{display:block;font:9px Arial,sans-serif;letter-spacing:2px;color:#bcc9c2;margin-top:5px}.team-label{font-size:11px;color:#b3c4bd;display:block;margin-bottom:8px}.team-select{width:100%;min-height:46px;background:#29 border-radius:8px;padding:9px 12px;background:#fafbf8;color:var(--ink);min-width:0}.search input{width:210px}.table{width:100%;border-collapse:collapse;text-align:left}.table th{font-size:10px;letter-spacing:1px;text-transform:uppercase;background:#fafbf8;color:var(--muted);padding:13px 20px;border-block:1px solid var(--line)}.table td{padding:18px 20px;border-bottom:1px solid #edf0eb;font-size:13px}.table tr:last-child td{border:0}.table tr:hover td{background:#fafbf8}.person-name{display:flex;gap:12px;align-items:center}.person-name button{padding:0;min-height:0;background:none;border:0;font-weight:600;text-align:left;border-radius:0}.person-name small{display:block;font-size:12px;margin-top:3px}.badge{display:inline-block;padding:4px 9px;border-radius:20px;font-size:11px;background:#f3eddf;color:#795e31;white-space:nowrap}.badge.green{background:#e8f2eb;color:#2b6047}.badge.blue{background:#e8eff2;color:#34545f}.next-step{font-size:12px;font-weight:600;color:#476555}.text-action{border:0;background:none;padding:8px;color:var(--navy);font-size:13px}.below{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:22px}.below .panel{padding:23px}.below h3{margin-bottom:14px}.activity{display:flex;gap:12px;margin-top:14px;font-size:13px}.activity p{margin-top:2px;color:var(--muted);font-size:12px}.tip{font:20px/1.5 Georgia,serif;margin:14px 0}.phone-only{display:none}.mock-note{font-size:11px;color:var(--muted);padding:20px 36px;border-top:1px solid var(--line)}.cards{display:none}.empty{padding:35px;text-align:center;color:var(--muted)}.detail-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:24px}.detail-head .avatar{width:58px;height:58px;font-size:18px}.detail-head h1{font-size:32px}.detail-head p{font-size:13px;color:var(--muted);margin-top:4px}.detail-head select{min-height:44px;padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff;margin-left:auto}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:24px}.steps button{text-align:left;font-size:13px;background:#fff}.steps button.active{border-color:#a68c63;background:#f4edde}.steps button span{display:block;font-size:11px;color:var(--muted)}.detail-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(230px,1fr);gap:22px}.detail-panel{padding:25px}.detail-panel h2{font-size:25px;margin-bottom:9px}.detail-panel p{margin-bottom:14px}.note{border-left:3px solid #c9b18c;padding:2px 0 2px 16px;margin-top:22px}.note small{font-size:11px}.note p{margin-top:9px;font-size:14px}.detail-action{margin-top:22px}.detail-aside .panel{padding:22px;margin-bottom:16px}.detail-aside h3{margin-bottom:12px}.detail-aside p{font-size:13px;color:var(--muted)}.detail-aside ul{padding-left:18px;font-size:13px;line-height:1.9}.confidence{background:#e8eee6;border-radius:8px;padding:14px;font-size:12px;margin:18px 0}.dimension{border-top:1px solid var(--line);padding-top:15px;margin-top:16px}.dimension h3{font-size:13px;margin-bottom:6px}.dimension p{font-size:14px}.operational .sidebar{width:auto;padding:24px 17px}.operational.shell{grid-template-columns:190px minmax(0,1fr)}.operational .heading h1{font:30px Arial,sans-serif;font-weight:600}.operational .summary{gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}.operational .summary>div{border:0;border-radius:0;border-right:1px solid var(--line);padding:15px 22px}.operational .summary strong{font:27px Arial,sans-serif;font-weight:600}.operational .table td{padding:13px 17px}.operational .below{grid-template-columns:1.6fr 1fr}.ops-banner{background:#e9efe9;padding:14px 19px;border:1px solid #d4ded1;border-radius:9px;display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:20px}.role-list{list-style:none;padding:0;margin:0}.role-list li{padding:14px 0;display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}.role-list li:last-child{border:0}.role-list small{display:block}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#18343b;color:white;padding:13px 20px;border-radius:10px;box-shadow:0 4px 15px #0002;z-index:10;font-size:13px;max-width:90vw}.mobile-nav{display:none}dialog{border:1px solid var(--line);border-radius:14px;max-width:480px;width:calc(100% - 32px);padding:25px;color:var(--ink)}dialog::backdrop{background:#12272c7a}dialog h2{margin-bottom:10px}dialog label{display:grid;gap:6px;margin:16px 0;font-size:13px}dialog input,dialog textarea{padding:12px;border:1px solid var(--line);border-radius:7px;width:100%}dialog .dialog-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}.phone.canvas{width:390px;max-width:100%;min-height:800px;border:8px solid #172b32;border-radius:35px}.phone .shell{display:block;min-height:800px}.phone .sidebar{display:none}.phone .topbar{padding:0 16px;height:68px}.phone .topbar .trail,.phone .team-people{display:none}.phone .phone-only{display:block}.phone .phone-brand{font:22px Georgia,serif;letter-spacing:3px}.phone .phone-only select{max-width:160px;min-height:44px;border:1px solid var(--line);border-radius:7px;padding:7px;background:#fff;font-size:12px}.phone .content{padding:25px 16px 90px}.phone h1{font-size:29px}.phone .heading{gap:12px;align-items:flex-start}.phone .heading p{font-size:13px}.phone .heading .primary{font-size:0;padding:6px;width:44px;flex:none}.phone .heading .primary:before{content:'+';font-size:24px}.phone .summary{gap:8px;grid-template-columns:repeat(3,1fr);margin-bottom:20px}.phone .summary>div{padding:12px 9px}.phone .summary span{font-size:10px}.phone .summary strong{font-size:25px}.phone .summary small{font-size:10px}.phone .table{display:none}.phone .cards{display:grid;padding:0 16px 16px;gap:12px}.prospect-card{border:1px solid var(--line);border-radius:10px;padding:15px;background:#fff}.prospect-card .card-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.prospect-card button{padding:0;background:none;border:0;min-height:44px;text-align:left}.prospect-card small{font-size:12px}.prospect-card .card-bottom{display:flex;align-items:center;justify-content:space-between;font-size:11px;border-top:1px solid var(--line);margin-top:12px;padding-top:12px}.phone .toolbar{padding:16px}.phone .search{width:100%}.phone .search input{flex:1;width:100px}.phone .search select{width:108px;font-size:12px}.phone .below{grid-template-columns:1fr;gap:14px}.phone .below .panel{padding:18px}.phone .mock-note{padding:16px;font-size:10px}.phone .mobile-nav{display:flex;position:sticky;bottom:0;z-index:4;background:#fff;border-top:1px solid var(--line);justify-content:space-around;padding:8px 4px}.phone .mobile-nav button{border:0;font-size:11px;flex:1;min-height:48px}.phone .mobile-nav button.active{color:var(--gold);background:#f5efe3}.phone .detail-head{gap:12px;margin-bottom:19px}.phone .detail-head h1{font-size:27px}.phone .detail-head select{margin:0;width:100%;font-size:13px}.phone .detail-head .avatar{width:45px;height:45px;font-size:14px}.phone .steps{gap:5px}.phone .steps button{padding:10px 7px;font-size:12px}.phone .steps button span{font-size:10px}.phone .detail-grid{grid-template-columns:1fr}.phone .detail-panel{padding:19px}.phone .detail-panel h2{font-size:24px}.phone .detail-action{position:sticky;bottom:80px;z-index:3;background:#fff;padding:10px;box-shadow:0 0 20px #15332b10;border:1px solid var(--line);border-radius:9px}.phone .detail-action button{width:100%}.phone .detail-aside .panel:not(:first-child){display:none}.phone .ops-banner{display:block;font-size:12px}.phone .ops-banner button{margin-top:10px;width:100%}.phone .operational .summary>div{padding:12px 9px}.phone .operational .heading h1{font-size:26px}.phone .role-list li{font-size:13px}
@media(max-width:700px){.prototype-bar{padding:16px}.prototype-controls{width:100%}.prototype-controls button{flex:1;padding:8px}.canvas{margin:16px auto}.canvas:not(.phone){overflow:auto}.canvas:not(.phone) .shell{min-width:1050px}}

<body>
<header class="prototype-bar"><div><h2>AIRA · Workspace design concepts</h2><p>Interactive mockup · fictional data · changes stay in this page until reload</p></div><div class="prototype-controls" aria-label="Design preview controls"><button data-concept="concierge" class="chosen">01 Concierge</button><button data-concept="operations">02 Team Operations</button><button data-device="desktop" class="chosen">Desktop</button><button data-device="phone">Phone</button><button id="role-preview">Owner view</button></div></header>
<main id="canvas" class="canvas"><div id="app"></div></main>
<dialog id="editor"><form id="editor-form"><h2 id="editor-title"></h2><p class="muted" style="font-size:13px">Sample only. This prototype does not connect to your database.</p><div id="editor-fields"></div><div class="dialog-actions"><button type="button" id="cancel">Cancel</button><button type="submit" class="primary">Add to mockup</button></div></form></dialog>
<div id="toast" role="status" hidden class="toast"></div>
<script>
const state={concept:'concierge',device:innerWidth<600?'phone':'desktop',role:'owner',view:'pipeline',team:'AIRA Residence',selected:1,step:0,query:'',filter:'all'};
const records=[{id:1,name:'Lim Wei',initial:'LW',budget:'RM 2.5–3.0M',owner:'Amira',status:'engaged',step:'Review profile',notes:2,approved:false,strategy:false},{id:2,name:'Sofia Rahman',initial:'SR',budget:'RM 3.2M',owner:'Daniel',status:'negotiating',step:'Prepare next meeting',notes:3,approved:true,strategy:true},{id:3,name:'Arjun Menon',initial:'AM',budget:'RM 2.8M',owner:'Amira',status:'new',step:'Log first observation',notes:0,approved:false,strategy:false},{id:4,name:'Mei Chen',initial:'MC',budget:'RM 4.0M',owner:'Jason',status:'engaged',step:'Generate profile',notes:1,approved:false,strategy:false}];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const member=(name,role,initial)=>`<li><div class="account"><span class="avatar">${initial}</span><div><b>${name}</b><small>${role==='Owner'?'Workspace administration':role==='Admin'?'Team management and assignment':'Prospects, observations and reviews'}</small></div></div><span class="badge ${role==='Owner'?'blue':'green'}">${role}</span></li>`;
function teamOptions(){return ['AIRA Residence','AIRA Partner Team','Personal workspace'].map(t=>`<option ${state.team===t?'selected':''}>${t}</option>`).join('')}
function nav(){return `<nav><button data-view="pipeline" class="${state.view==='pipeline'||state.view==='detail'?'active':''}">◈ &nbsp; Prospects <span>${state.team==='AIRA Residence'?visible().length:0}</span></button><button data-view="team" class="${state.view==='team'?'active':''}">♧ &nbsp; Team & roles <span>${state.team==='AIRA Residence'?4:1}</span></button></nav>`}
function shell(content){return `<div class="shell ${state.concept==='operations'?'operational':''}"><aside class="sidebar"><div class="brand">AIRA<small>CONSULTANT WORKSPACE</small></div><div><label class="team-label" for="team-desktop">ACTIVE TEAM</label><select id="team-desktop" class="team-select" data-team>${teamOptions()}</select></div>${nav()}<div class="sidebar-bottom"><div class="account"><span class="avatar">${state.role==='owner'?'AN':'DL'}</span><div><b>${state.role==='owner'?'Amira Noor':'Daniel Lim'}</b><small style="display:block">${state.role==='owner'?'Owner':'Consultant'} · sample account</small></div></div></div></aside><div><header class="topbar"><div class="trail">${esc(state.team)} <b>/ ${state.view==='team'?'Team settings':state.view==='detail'?'Prospect workspace':'Prospects'}</b></div><div class="team-people"><div class="avatars"><span class="avatar">AN</span><span class="avatar">DL</span><span class="avatar">JT</span></div><button data-view="team" class="text-action">View team →</button></div><span class="phone-only phone-brand">AIRA</span><div class="phone-only"><label aria-label="Active team"><select data-team>${teamOptions()}</select></label></div></header><div class="content">${content}</div><footer class="mock-note">${state.concept==='concierge'?'Concept 01 · Concierge — calm hierarchy, shared pipeline and evidence-led prospect preparation.':'Concept 02 · Team Operations — denser triage, explicit ownership and review workload.'} Fictional sample workspace.</footer><nav class="mobile-nav" aria-label="Mobile navigation"><button data-view="pipeline" class="${state.view!=='team'?'active':''}">◈<br>Prospects</button><button data-view="team" class="${state.view==='team'?'active':''}">♧<br>Team</button><button data-action="new">＋<br>New prospect</button></nav></div></div>`}
function visible(){return state.role==='owner'?records:records.filter(r=>r.owner==='Daniel')}
function rows(){return state.team!=='AIRA Residence'?[]:visible().filter(r=>r.name.toLowerCase().includes(state.query.toLowerCase())&&(state.filter==='all'||r.status===state.filter))}
function prospectRow(r){return `<tr><td><div class="person-name"><span class="avatar">${esc(r.initial)}</span><div><button data-open="${r.id}">${esc(r.name)}</button><small>${esc(r.budget)}</small></div></div></td><td><span class="badge ${r.status==='negotiating'?'green':r.status==='new'?'blue':''}">${esc(r.status)}</span></td><td>${esc(r.owner)}</td><td><span class="next-step">${esc(r.step)}</span><small style="display:block">${r.notes} observation${r.notes===1?'':'s'}</small></td><td><button data-open="${r.id}" class="text-action" aria-label="Open ${esc(r.name)}">Open →</button></td></tr>`}
function prospectCard(r){return `<article class="prospect-card"><div class="card-top"><div><button data-open="${r.id}"><b>${esc(r.name)}</b><br><small>${esc(r.budget)}</small></button></div><span class="badge ${r.status==='negotiating'?'green':r.status==='new'?'blue':''}">${esc(r.status)}</span></div><div class="card-bottom"><span>${esc(r.owner)} · ${r.notes} notes</span><button data-open="${r.id}" class="next-step">${esc(r.step)} →</button></div></article>`}
function pipeline(){const list=rows(),all=state.team==='AIRA Residence'?visible():[];return `<div class="heading"><div><div class="eyebrow">${state.role==='owner'?'SHARED TEAM PIPELINE':'MY ASSIGNED LEADS'}</div><h1>${state.concept==='concierge'?'A thoughtful next move.':'Team prospect queue'}</h1><p>${state.concept==='concierge'?'Turn meeting observations into a considered conversation.':'See ownership, review priorities and the next action at a glance.'}</p></div><button class="primary" data-action="new">＋ &nbsp; New prospect</button></div><div class="summary"><div><span>Active prospects</span><strong>${all.length}</strong><small>In this team only</small></div><div><span>Ready for review</span><strong>${all.filter(r=>r.notes&&!r.approved).length}</strong><small>Consultant approval</small></div><div><span>Negotiating</span><strong>${all.filter(r=>r.status==='negotiating').length}</strong><small>Prepare next meeting</small></div></div>${state.concept==='operations'&&all.some(r=>r.notes&&!r.approved)?`<div class="ops-banner"><span><b>${all.filter(r=>r.notes&&!r.approved).length} profiles need a decision.</b> Review evidence before preparing the pitch.</span><button data-open="${all.find(r=>r.notes&&!r.approved).id}" class="text-action">Review queue →</button></div>`:''}<section class="panel"><div class="toolbar"><div><h3>${state.concept==='concierge'?(state.role==='owner'?'Your team’s prospects':'My leads'):'Active queue'}</h3><small>${state.role==='owner'?'Owner view · all team prospects':'Consultant view · Daniel’s assigned prospects'}</small></div><div class="search"><input aria-label="Search prospects" id="search" placeholder="Search prospects…" value="${esc(state.query)}"><select id="filter" aria-label="Filter prospect status"><option value="all">All statuses</option>${['new','engaged','negotiating'].map(v=>`<option value="${v}" ${state.filter===v?'selected':''}>${v}</option>`).join('')}</select></div></div>${list.length?`<table class="table"><thead><tr><th>Prospect / Budget</th><th>Status</th><th>Consultant</th><th>Next action</th><th><span style="position:absolute;clip:rect(0,0,0,0)">Open prospect</span></th></tr></thead><tbody>${list.map(prospectRow).join('')}</tbody></table><div class="cards">${list.map(prospectCard).join('')}</div>`:'<div class="empty">No prospects in this view.<br>Create a sample prospect or change your search.</div>'}</section><div class="below"><section class="panel"><span class="eyebrow">TEAM ACTIVITY · SAMPLE</span><h3 style="margin-top:8px">A shared understanding</h3>${state.team==='AIRA Residence'?`<div class="activity"><span class="avatar">DL</span><div><b>Daniel prepared Sofia’s strategy</b><p>Approved profile · capital preservation · 24 min ago</p></div></div>${state.role==='owner'?'<div class="activity"><span class="avatar">AN</span><div><b>Amira logged a meeting with Lim Wei</b><p>Second observation · ready for review · 1 hr ago</p></div></div>':''}`:'<p class="muted">No sample activity in this team yet.</p>'}</section><section class="panel"><span class="eyebrow">THE CONSULTANT’S CRAFT</span><p class="tip">Observe carefully.<br>Review the evidence.<br>Prepare the next conversation.</p><small>Profiles remain drafts until a consultant reviews them. Cultural context is recorded by the prospect; it is never a substitute for personal evidence.</small></section></div>`}
function detail(){const r=records.find(x=>x.id===state.selected);if(!r)return pipeline();const title=['Meeting observations','Review the profile','Prepare the strategy'][state.step];return `<button data-view="pipeline" class="text-action" style="padding-left:0;margin-bottom:16px">← All prospects</button><div class="detail-head"><span class="avatar">${esc(r.initial)}</span><div><h1>${esc(r.name)}</h1><p>${esc(r.budget)} · Consultant ${esc(r.owner)}</p></div><select id="status" aria-label="Prospect status">${['new','engaged','negotiating','closed-won','closed-lost'].map(v=>`<option ${r.status===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="steps" aria-label="Prospect workflow">${['1 · Observe','2 · Review','3 · Strategy'].map((s,i)=>`<button data-step="${i}" class="${state.step===i?'active':''}" aria-current="${state.step===i?'step':'false'}">${s}<span>${i===0?r.notes+' observations':i===1?(r.approved?'Approved':'Draft · review needed'):(r.strategy?'Prepared':'Needs approved profile')}</span></button>`).join('')}</div><div class="detail-grid"><section class="panel detail-panel"><span class="eyebrow">${state.step===0?'CONSULTANT EVIDENCE':state.step===1?'EVIDENCE-BASED SAMPLE DRAFT':'MEETING PREPARATION'}</span><h2 style="margin-top:9px">${title}</h2>${state.step===0?`<p class="muted">Record what the prospect said and what you observed.</p>${r.notes?`<div class="note"><small>Amira · Site visit · Sample observation</small><p>Asked how the development retains its value. Wants to compare maintenance costs before committing.</p><span class="badge blue">Analytical · deliberate</span></div>${r.notes>1?'<div class="note"><small>Amira · Meeting · Sample observation</small><p>Discussed a future home for the family and requested time to consult their partner. Prefers evidence over urgency.</p><span class="badge green">Family use · long-term value</span></div>':''}`:'<p class="muted">No observations yet. Log the first meeting before building a profile.</p>'}${(r.observations||[]).map(n=>`<div class="note"><small>New sample observation · ${esc(r.owner)}</small><p>${esc(n)}</p></div>`).join('')}<div class="detail-action"><button class="primary" data-action="note">＋ &nbsp; Log observation</button></div>`:state.step===1?`${r.notes?`<p>Prioritises long-term value and a considered family decision. Build confidence through practical evidence rather than pressure.</p><div class="confidence"><b>${r.approved?'Approved by consultant':'Unreviewed sample draft'}</b><br>Source: sample evidence-based draft · Evidence confidence ${Math.min(90,50+r.notes*10)}%<br><small>This score describes evidence coverage, not predictive accuracy.</small></div><div class="dimension"><h3>Investment objectives</h3><p>Capital preservation; a future family asset.</p></div><div class="dimension"><h3>Behavioural tendencies</h3><p>Analytical, cautious and deliberate. Based on questions about costs and requests for comparison.</p></div><div class="dimension"><h3>Lifestyle and motivation</h3><p>Family convenience and long-term security. Confirm priorities at the next meeting.</p></div><div class="detail-action"><button class="primary" data-action="approve" ${r.approved?'disabled':''}>${r.approved?'Profile approved':'Approve sample profile'}</button></div>`:'<p class="muted">Log at least one observation before reviewing a profile.</p><button class="primary" data-step="0">Log first observation →</button>'}`:`${r.approved?`<p class="tip">Capital preservation.<br>A home for the next generation.</p><div class="dimension"><h3>Three talking points</h3><p>1. Compare ownership and maintenance costs transparently.<br>2. Connect family use to space, access and amenities.<br>3. Offer documented value evidence and time to review.</p></div><div class="dimension"><h3>Closing approach</h3><p>Invite the prospect and their partner to a follow-up discussion. Agree on questions to answer, rather than forcing a deadline.</p></div><div class="dimension"><h3>Cultural considerations</h3><p>Ask about preferred language and decision-makers. Follow their stated preferences; avoid assumptions.</p></div><div class="detail-action"><button class="primary" data-action="strategy">${r.strategy?'Refresh sample strategy':'Prepare sample strategy'}</button></div>`:'<p class="muted">Approve a profile before preparing a strategy.</p><button class="primary" data-step="1">Review the profile →</button>'}`}</section><aside class="detail-aside"><section class="panel"><h3>Prospect context</h3>${state.role==='owner'?`<label style="display:grid;font-size:12px;gap:6px;margin-bottom:14px">Assigned consultant<select id="assigned" style="padding:10px;border:1px solid var(--line);border-radius:7px">${['Amira','Daniel','Jason'].map(n=>`<option ${r.owner===n?'selected':''}>${n}</option>`).join('')}</select></label>`:''}<p>Referral · investor / family use</p><p style="margin-top:10px">Budget ${esc(r.budget)}<br>Assigned to ${esc(r.owner)}<br>${state.role==='owner'?'Team owner / admins':'Assigned consultant'} · ${esc(state.team)}</p></section><section class="panel"><h3>Next conversation</h3><ul><li>Confirm family priorities</li><li>Bring cost comparisons</li><li>Invite their partner’s questions</li></ul></section><section class="panel"><h3>Human review matters</h3><p>Interpret observations as evidence. Review every draft before relying on it in a meeting.</p></section></aside></div>`}
function team(){return `<div class="heading"><div><span class="eyebrow">WORKSPACE ACCESS</span><h1 style="margin-top:8px">${esc(state.team)}</h1><p>People and roles in the selected sample team.</p></div>${state.role==='owner'?'<button class="primary" data-action="invite">＋ &nbsp; Preview invite</button>':''}</div><section class="panel detail-panel"><h2>Members</h2><p class="muted">Access belongs to one workspace. Switching teams changes the visible pipeline.</p><ul class="role-list">${member('Amira Noor','Owner','AN')}${state.team==='AIRA Residence'?member('Daniel Lim','Consultant','DL')+member('Jason Tan','Consultant','JT')+member('Maya Hassan','Admin','MH'):''}</ul></section><div class="below"><section class="panel"><h3>Owner</h3><p class="muted">See all team prospects, assign consultants and manage workspace membership.</p><h3 style="margin-top:18px">Consultant</h3><p class="muted">See assigned prospects, record observations, review profiles and prepare strategies.</p></section><section class="panel"><h3>Admin</h3><p class="muted">See all team prospects, assign consultants and manage consultant membership. Only the owner grants admin access.</p><p style="margin-top:18px;font-size:13px">Owner, admin and consultant views are illustrated here. Production access is enforced through database policies.</p></section></div>`}
function render(){document.getElementById('canvas').className='canvas'+(state.device==='phone'?' phone':'');document.getElementById('app').innerHTML=shell(state.view==='team'?team():state.view==='detail'?detail():pipeline());document.querySelectorAll('[data-concept]').forEach(b=>b.classList.toggle('chosen',b.dataset.concept===state.concept));document.querySelectorAll('[data-device]').forEach(b=>b.classList.toggle('chosen',b.dataset.device===state.device));bind()}
function toast(message){const el=document.getElementById('toast');el.textContent=message;el.hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.hidden=true,3500)}
function editor(kind){state.editor=kind;document.getElementById('editor-title').textContent=kind==='new'?'Create a sample prospect':kind==='note'?'Log a sample observation':'Preview a team invitation';document.getElementById('editor-fields').innerHTML=kind==='new'?'<label>Prospect name<input name="name" required maxlength="80" placeholder="e.g. Alex Morgan"></label><label>Budget range<input name="budget" placeholder="e.g. RM 2.5M" maxlength="60"></label>':kind==='note'?'<label>Meeting observation<textarea name="note" rows="4" required placeholder="What did they say or ask?"></textarea></label>':'<label>Email<input name="email" type="email" required placeholder="colleague@example.com"></label><p class="muted">No email will be sent. This only previews the invitation interaction.</p>';document.getElementById('editor').showModal()}
function bind(){document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;render()});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{state.selected=Number(b.dataset.open);state.view='detail';state.step=0;render()});document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{state.step=Number(b.dataset.step);render()});document.querySelectorAll('[data-team]').forEach(s=>s.onchange=()=>{state.team=s.value;state.view='pipeline';state.query='';state.filter='all';render()});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const action=b.dataset.action,r=records.find(x=>x.id===state.selected);if(['new','note','invite'].includes(action)){editor(action);return}if(action==='approve'){r.approved=true;r.step='Prepare strategy';render();toast('Sample profile approved in this preview.')}if(action==='strategy'){r.strategy=true;r.step='Prepare next meeting';render();toast('Sample strategy prepared in this preview.')}});const search=document.getElementById('search');if(search)search.oninput=()=>{const position=search.selectionStart;state.query=search.value;render();const replacement=document.getElementById('search');replacement.focus();replacement.setSelectionRange(position,position)};const filter=document.getElementById('filter');if(filter)filter.onchange=()=>{state.filter=filter.value;render()};const assigned=document.getElementById('assigned');if(assigned)assigned.onchange=()=>{records.find(r=>r.id===state.selected).owner=assigned.value;render();toast('Sample assignment updated. Consultant view is scoped to Daniel.')} ;const status=document.getElementById('status');if(status)status.onchange=()=>{records.find(r=>r.id===state.selected).status=status.value;toast('Sample status updated. Reload resets the preview.')}}
document.getElementById('role-preview').onclick=()=>{state.role=state.role==='owner'?'consultant':'owner';state.view='pipeline';document.getElementById('role-preview').textContent=state.role==='owner'?'Owner view':'Consultant view';render()};document.querySelectorAll('[data-concept]').forEach(b=>b.onclick=()=>{state.concept=b.dataset.concept;render()});document.querySelectorAll('[data-device]').forEach(b=>b.onclick=()=>{state.device=b.dataset.device;render()});document.getElementById('cancel').onclick=()=>document.getElementById('editor').close();document.getElementById('editor-form').onsubmit=e=>{e.preventDefault();const values=new FormData(e.target);if(state.editor==='new'){const name=String(values.get('name')).trim();if(!name)return;records.push({id:Date.now(),name,initial:name.split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase(),budget:String(values.get('budget')).trim()||'Budget to confirm',owner:state.role==='owner'?'Amira':'Daniel',status:'new',step:'Log first observation',notes:0,approved:false,strategy:false});state.team='AIRA Residence';state.view='pipeline';toast('Sample prospect added. Reload resets the preview.')}else if(state.editor==='note'){const r=records.find(x=>x.id===state.selected);r.notes++;r.observations??=[];r.observations.push(String(values.get('note')));r.step='Review profile';r.approved=false;r.strategy=false;toast('Sample observation added to the preview count.')}else toast('Invitation previewed. No email was sent.');document.getElementById('editor').close();render()};render();
</script>
</body>
</html>
